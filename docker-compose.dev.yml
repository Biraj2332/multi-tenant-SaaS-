services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tenantops-postgres-dev
    environment:
      POSTGRES_USER: tenantops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tenantops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tenantops-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tenantops-api-dev
    ports:
      - "13000:13000"
    environment:
      PORT: 13000
      NODE_ENV: development
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://tenantops:password@postgres:5432/tenantops_dev
      DATABASE_MAX_CONNECTIONS: 10
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:5173
      API_URL: http://localhost:13000
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
      ENABLE_REQUEST_LOGGING: "true"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd apps/api && pnpm dev"

  # Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tenantops-web-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:13000
      VITE_API_PREFIX: api/v1
      VITE_API_TIMEOUT: "10000"
      VITE_APP_NAME: TenantOps
      VITE_APP_VERSION: 1.0.0
      VITE_APP_ENV: development
      VITE_ENABLE_ANALYTICS: "false"
      VITE_ENABLE_DEBUG: "true"
      VITE_PRIMARY_COLOR: "#4f46e5"
      VITE_SECONDARY_COLOR: "#7c3aed"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api
    command: sh -c "cd apps/web && pnpm dev -- --host 0.0.0.0"

volumes:
  postgres_data_dev:
  redis_data_dev:
