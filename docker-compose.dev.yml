services:
  postgres:
    image: postgres:15-alpine
    container_name: tenantops-postgres-dev
    environment:
      POSTGRES_USER: tenantops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tenantops_dev
    ports:
      - "5438:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tenantops-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tenantops-api-dev
    ports:
      - "13000:13000"
    env_file:
      - ./apps/api/.env
    environment:
      # Override host references so containers can resolve each other on the docker network
      DATABASE_URL: postgresql://tenantops:password@postgres:5432/tenantops_dev
      REDIS_URL: redis://redis:6379
      PORT: 13000
      NODE_ENV: development
      APP_URL: http://localhost:5173
      API_URL: http://localhost:13000
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd apps/api && pnpm dev"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tenantops-web-dev
    ports:
      - "5173:5173"
    env_file:
      - ./apps/web/.env
    environment:
      VITE_API_URL: http://localhost:13000
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api
    command: sh -c "cd apps/web && pnpm dev --host 0.0.0.0"

volumes:
  postgres_data_dev:
  redis_data_dev:
