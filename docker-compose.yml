services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tenantops-postgres
    environment:
      POSTGRES_USER: tenantops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tenantops_dev
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tenantops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
