services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tenantops-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_MULTIPLE_DATABASES: "${DB_NAME},${DB_AUTH_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    restart: unless-stopped
    networks:
      - tenantops-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tenantops-redis-prod
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - tenantops-network-prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      target: api-production
    container_name: tenantops-api-prod
    ports:
      - "13000:13000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tenantops-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Web App
  web:
    build:
      context: .
      target: web-production
    container_name: tenantops-web-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tenantops-network-prod

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: tenantops-nginx-prod
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - tenantops-network-prod

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  tenantops-network-prod:
    driver: bridge
